<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d18">
  <meta name="description" content="Telegram activity monitoring dashboard">
  <title>Telegram Activity Dashboard</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080d18;
      --surface: rgba(17, 25, 41, .88);
      --surface-2: #111b2c;
      --surface-3: #162238;
      --border: rgba(151, 173, 211, .13);
      --text: #f3f6fc;
      --muted: #93a1b8;
      --blue: #62a9ff;
      --blue-2: #3589f5;
      --green: #36d996;
      --red: #ff6b7a;
      --amber: #ffc66d;
      --radius: 20px;
      --shadow: 0 18px 55px rgba(0, 0, 0, .25);
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 18px 42px;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 12% 0%, rgba(45, 111, 196, .22), transparent 38rem),
        radial-gradient(ellipse at 92% 12%, rgba(88, 75, 190, .15), transparent 34rem),
        var(--bg);
    }

    button, select, a { font: inherit; }
    a { color: inherit; }
    .container { width: min(1080px, 100%); margin: 0 auto; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 25px;
    }
    .brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      border: 1px solid rgba(98, 169, 255, .3);
      border-radius: 15px;
      color: #dcecff;
      background: linear-gradient(145deg, #23518a, #182c50);
      box-shadow: 0 8px 25px rgba(28, 105, 201, .2);
      font-size: 21px;
      font-weight: 800;
    }
    h1 { margin: 0; font-size: clamp(23px, 4vw, 31px); letter-spacing: -.8px; }
    .subtitle { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(17, 25, 41, .65);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .live-pill::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px rgba(54, 217, 150, .7);
    }
    .top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex: 0 0 auto;
    }
    .top-contact {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 39px;
      padding: 0 13px;
      border: 1px solid rgba(98, 169, 255, .32);
      border-radius: 12px;
      color: #eef6ff;
      background: linear-gradient(135deg, #278de8, #1766bd);
      box-shadow: 0 7px 20px rgba(30, 119, 207, .18);
      text-decoration: none;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      transition: transform .18s ease, filter .18s ease;
    }
    .top-contact:hover { transform: translateY(-2px); filter: brightness(1.1); }
    .top-contact svg { width: 15px; height: 15px; fill: currentColor; }

    .panel {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: linear-gradient(145deg, rgba(20, 31, 50, .96), rgba(13, 21, 35, .96));
      box-shadow: var(--shadow);
    }
    .status-panel {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      padding: 23px 25px;
      margin-bottom: 15px;
    }
    .status-main { display: flex; align-items: center; gap: 15px; min-width: 0; }
    .status-orb {
      position: relative;
      width: 15px;
      height: 15px;
      flex: 0 0 15px;
      border-radius: 50%;
      background: #68758b;
    }
    .status-orb.online {
      background: var(--green);
      box-shadow: 0 0 0 6px rgba(54, 217, 150, .1), 0 0 19px rgba(54, 217, 150, .7);
    }
    .status-orb.offline {
      background: var(--red);
      box-shadow: 0 0 0 6px rgba(255, 107, 122, .09);
    }
    .eyebrow {
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    .status-value { margin-top: 4px; font-size: 25px; font-weight: 800; letter-spacing: -.5px; }
    .status-value.online { color: var(--green); }
    .status-value.offline { color: #ff8995; }
    .updated { color: var(--muted); font-size: 12px; text-align: right; }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 13px;
      margin: 0 0 29px;
    }
    .stat {
      min-width: 0;
      padding: 19px;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: var(--surface);
      box-shadow: 0 10px 28px rgba(0, 0, 0, .12);
    }
    .stat-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .stat-icon {
      display: grid;
      place-items: center;
      width: 31px;
      height: 31px;
      border-radius: 10px;
      color: var(--blue);
      background: rgba(98, 169, 255, .11);
      font-size: 15px;
    }
    .stat-label {
      margin-top: 13px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .stat-value {
      overflow-wrap: anywhere;
      margin-top: 7px;
      font-size: clamp(15px, 2vw, 19px);
      font-weight: 750;
      line-height: 1.4;
    }
    .stat-hint { margin-top: 4px; color: #71819a; font-size: 11px; }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin: 0 0 13px;
    }
    .section-heading h2 { margin: 0; font-size: 19px; letter-spacing: -.35px; }
    .section-heading p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .history-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 13px;
    }
    .select-wrap { position: relative; width: min(330px, 100%); }
    select {
      width: 100%;
      min-height: 46px;
      padding: 0 42px 0 14px;
      appearance: none;
      outline: none;
      border: 1px solid var(--border);
      border-radius: 13px;
      color: var(--text);
      background: #111b2c;
      cursor: pointer;
    }
    .select-wrap::after {
      content: "⌄";
      position: absolute;
      top: 8px;
      right: 15px;
      color: var(--muted);
      pointer-events: none;
      font-size: 20px;
    }
    select:focus-visible, a:focus-visible, button:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 3px;
    }
    .history {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(13, 21, 35, .92);
      box-shadow: var(--shadow);
    }
    .day { border-bottom: 1px solid var(--border); }
    .day:last-child { border-bottom: 0; }
    .day-summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 20px;
      width: 100%;
      padding: 18px 20px;
      border: 0;
      color: inherit;
      text-align: left;
      background: transparent;
      cursor: pointer;
      transition: background .18s ease;
    }
    .day-summary:hover { background: rgba(98, 169, 255, .055); }
    .day-title { font-size: 14px; font-weight: 750; }
    .day-date { margin-top: 5px; color: var(--muted); font-size: 11px; }
    .day-total { color: var(--blue); font-size: 13px; font-weight: 800; white-space: nowrap; }
    .day-sessions { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 11px; white-space: nowrap; }
    .arrow { display: inline-block; transition: transform .2s ease; }
    .day.open .arrow { transform: rotate(180deg); }
    .day-details { display: none; padding: 0 20px 13px; background: rgba(4, 9, 17, .25); }
    .day.open .day-details { display: block; }
    .session {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 14px 0;
      border-top: 1px solid var(--border);
    }
    .session:first-child { border-top: 0; }
    .session-time { font-size: 13px; font-weight: 650; overflow-wrap: anywhere; }
    .session-end { margin-top: 5px; color: var(--muted); font-size: 11px; }
    .session-duration { color: var(--blue); font-size: 13px; font-weight: 800; white-space: nowrap; }
    .empty { padding: 25px 16px; color: var(--muted); text-align: center; font-size: 13px; }
    .error {
      display: none;
      margin: 0 0 16px;
      padding: 13px 15px;
      border: 1px solid rgba(255, 107, 122, .28);
      border-radius: 13px;
      color: #ff9aa4;
      background: rgba(255, 107, 122, .08);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .contact-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-top: 22px;
      padding: 21px 23px;
      border: 1px solid rgba(98, 169, 255, .22);
      border-radius: 18px;
      background:
        radial-gradient(circle at 100% 0%, rgba(47, 133, 232, .17), transparent 23rem),
        rgba(17, 27, 44, .88);
    }
    .contact-copy { min-width: 0; }
    .contact-title { margin: 0 0 6px; font-size: 15px; font-weight: 800; }
    .contact-message { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .telegram-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 43px;
      flex: 0 0 auto;
      padding: 0 16px;
      border: 1px solid rgba(98, 169, 255, .35);
      border-radius: 12px;
      color: white;
      background: linear-gradient(135deg, #278de8, #1766bd);
      box-shadow: 0 8px 22px rgba(30, 119, 207, .2);
      text-decoration: none;
      font-size: 12px;
      font-weight: 800;
      transition: transform .18s ease, filter .18s ease;
    }
    .telegram-link:hover { transform: translateY(-2px); filter: brightness(1.1); }
    .telegram-link svg { width: 16px; height: 16px; fill: currentColor; }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 24px;
      color: #6f7e95;
      font-size: 11px;
    }
    .refresh-indicator { display: inline-flex; align-items: center; gap: 7px; }
    .refresh-indicator::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
    }




    /* Small 3D side-scrolling platform mascot */
    .mascot {
      position: fixed; z-index: 40; left: calc(50% - 30px); top: calc(50% - 41px);
      width: 60px; height: 82px; pointer-events: none;
      transition: left .08s linear, top .08s linear;
    }
    .mascot-bubble {
      position:fixed; left:50vw; top:8px; transform:translate(-50%,5px);
      width:max-content; max-width:min(260px, calc(100vw - 24px)); padding:7px 10px; border-radius:10px 10px 10px 3px;
      border:1px solid #8dc5ff55; color:#f6fbff; background:linear-gradient(145deg,#24466e,#132843);
      box-shadow:0 5px 16px #0007; font-size:10px; font-weight:750; line-height:1.3;
      opacity:0; transition:opacity .2s,transform .2s;
    }
    .mascot.show-message .mascot-bubble { opacity:1; transform:translate(-50%,0); }
    .bot3d { position:absolute; left:0; bottom:0; width:104px; height:138px; transform:scale(.56); transform-origin:bottom left; }
    .bot-shadow { position:absolute; width:66px; height:13px; left:19px; bottom:3px; border-radius:50%; background:#02081788; filter:blur(5px); }
    .bot-head {
      position:absolute; z-index:4; left:10px; top:9px; width:84px; height:70px;
      border-radius:48% 48% 43% 43%; border:2px solid #a9dcff;
      background:linear-gradient(145deg,#b6e4ff 0%,#5ca9eb 27%,#2874bd 72%,#174d89 100%);
      box-shadow:inset 5px 6px 8px #ffffff88,inset -7px -8px 12px #103d78aa,0 8px 13px #02081766;
      transform:translateZ(13px) rotateY(-9deg);
    }
    .bot-face { position:absolute; inset:11px 7px 9px; border-radius:48% 48% 45% 45%; background:linear-gradient(145deg,#fff,#eef5ff 65%,#d5e3f5); box-shadow:inset 0 2px 5px #fff,0 1px 3px #17436d66; }
    .bot-eye { position:absolute; top:22px; width:13px; height:16px; border-radius:55% 55% 48% 48%; background:#101827; box-shadow:inset 2px 2px 2px #ffffff55; }
    .bot-eye.left { left:19px; transform:rotate(8deg); } .bot-eye.right { right:19px; transform:rotate(-8deg); }
    .bot-mouth { position:absolute; left:50%; top:43px; width:10px; height:6px; transform:translateX(-50%); border-bottom:2px solid #263044; border-radius:50%; }
    .bot-antenna { position:absolute; z-index:5; left:48px; top:0; width:7px; height:16px; border-radius:8px; background:linear-gradient(90deg,#d8f0ff,#438bd0); }
    .bot-antenna:after { content:""; position:absolute; left:-5px; top:-9px; width:17px; height:17px; border-radius:50%; background:radial-gradient(circle at 30% 25%,#fff,#8bd0ff 35%,#2777c1 78%); box-shadow:0 2px 5px #0005; }
    .bot-body { position:absolute; z-index:3; left:27px; top:76px; width:52px; height:43px; border-radius:42% 42% 35% 35%; background:linear-gradient(145deg,#9dd9ff,#398de0 55%,#1d5b9d); border:1px solid #8ccaff; box-shadow:inset 4px 4px 7px #ffffff77,inset -5px -5px 8px #123f77aa,0 5px 9px #0005; }
    .bot-core { position:absolute; left:17px; top:12px; width:18px; height:18px; border-radius:50%; background:radial-gradient(circle at 32% 28%,#fff,#d9eaff 65%,#a4c7e9); }
    .bot-arm { position:absolute; z-index:2; top:81px; width:17px; height:33px; border-radius:12px; background:linear-gradient(90deg,#1c66a9,#8ed0ff 45%,#2874bb); box-shadow:inset 2px 1px 3px #fff8,0 3px 5px #0004; transform-origin:50% 7px; }
    .bot-arm.left { left:13px; } .bot-arm.right { right:13px; }
    .bot-leg { position:absolute; z-index:1; top:111px; width:19px; height:24px; border-radius:8px 8px 10px 10px; background:linear-gradient(90deg,#1c5d9b,#8bcfff 45%,#276eb2); transform-origin:50% 3px; box-shadow:inset 2px 1px 3px #fff8; }
    .bot-leg.left { left:32px; } .bot-leg.right { right:32px; }
    .mascot.walking .bot-leg.left { animation:bot-step .24s ease-in-out infinite alternate; }
    .mascot.walking .bot-leg.right { animation:bot-step .24s ease-in-out infinite alternate-reverse; }
    .mascot.walking .bot-arm.left { animation:bot-swing .24s ease-in-out infinite alternate-reverse; }
    .mascot.walking .bot-arm.right { animation:bot-swing .24s ease-in-out infinite alternate; }
    .mascot.jumping .bot-leg { animation:bot-tuck .4s ease-in-out infinite alternate; }
    .mascot.falling .bot-arm { animation:bot-flail .18s ease-in-out infinite alternate; }
    .mascot.climbing .bot-arm.left { animation:bot-climb .3s ease-in-out infinite alternate; }
    .mascot.climbing .bot-arm.right { animation:bot-climb .3s ease-in-out infinite alternate-reverse; }
    .mascot.waving .bot-arm.right { animation:bot-wave .28s ease-in-out infinite alternate; }
    .mascot.sad .bot-mouth { width:12px; height:6px; border-bottom:0; border-top:2px solid #263044; top:44px; }
    /* Opening scene: only the sleepy head peeks over the status card. */
    .mascot.intro-sleeping {
      z-index:2;
      height:38px;
      /* Force the sleeping head to the true viewport centre, overriding any
         inline platform coordinates set by the movement routine. */
      left:50vw !important;
      top:50vh !important;
      transform:translate(-50%,-50%) !important;
    }
    .mascot.intro-sleeping .bot3d { transform:scale(.56); transform-origin:top left; }
    .mascot.intro-sleeping .bot-body,
    .mascot.intro-sleeping .bot-arm,
    .mascot.intro-sleeping .bot-leg,
    .mascot.intro-sleeping .bot-antenna { opacity:0; }
    .mascot.intro-sleeping .bot-eye { transform:scaleY(.12); transform-origin:center; }
    .mascot.intro-sleeping .bot-mouth { opacity:.35; }
    .mascot.intro-waking { z-index:40; }
    .mascot.intro-waking .bot-eye { animation:intro-eyes-open .35s ease-out both; }
    .mascot.intro-waking .bot-antenna { opacity:1; animation:intro-pop .35s ease-out both; }
    .mascot.intro-waving .bot-arm.right { animation:intro-fast-wave .13s ease-in-out infinite alternate; }
    .mascot.intro-waving .bot-arm.left { animation:intro-excited .22s ease-in-out infinite alternate; }
    @keyframes intro-eyes-open { from{transform:scaleY(.12)} to{transform:scaleY(1)} }
    @keyframes intro-pop { from{transform:translateY(8px) scale(.6)} to{transform:translateY(0) scale(1)} }
    @keyframes intro-fast-wave { from{transform:rotate(-48deg)} to{transform:rotate(-145deg)} }
    @keyframes intro-excited { from{transform:rotate(25deg)} to{transform:rotate(-35deg)} }
    @keyframes bot-step { from{transform:rotate(-32deg)} to{transform:rotate(32deg)} }
    @keyframes bot-swing { from{transform:rotate(-28deg)} to{transform:rotate(28deg)} }
    @keyframes bot-climb { from{transform:rotate(-65deg)} to{transform:rotate(35deg)} }
    @keyframes bot-wave { from{transform:rotate(-55deg)} to{transform:rotate(-135deg)} }
    @keyframes bot-tuck { from{transform:rotate(-18deg)} to{transform:rotate(24deg)} }
    @keyframes bot-flail { from{transform:rotate(-55deg)} to{transform:rotate(55deg)} }
    @media(max-width:520px){.mascot-bubble{max-width:min(230px,calc(100vw - 20px));font-size:10px}}
    @media(prefers-reduced-motion:reduce){.mascot,.mascot *{animation:none!important;transition:none!important}}
    @media (max-width: 760px) {
      body { padding: 21px 14px 32px; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stat { padding: 16px; }
    }
    @media (max-width: 520px) {
      body { padding: 16px 11px 28px; }
      .topbar { align-items: flex-start; margin-bottom: 18px; }
      .brand-mark { width: 41px; height: 41px; flex-basis: 41px; border-radius: 13px; }
      .topbar { flex-wrap: wrap; }
      .top-actions { gap: 7px; }
      .live-pill { padding: 8px 9px; font-size: 9px; }
      .top-contact { min-height: 36px; padding: 0 10px; font-size: 11px; }
      .status-panel { align-items: flex-start; flex-direction: column; gap: 13px; padding: 18px; }
      .updated { padding-left: 30px; text-align: left; }
      .status-value { font-size: 22px; }
      .stats { gap: 9px; margin-bottom: 25px; }
      .stat { padding: 14px; border-radius: 15px; }
      .stat-icon { width: 28px; height: 28px; }
      .stat-label { font-size: 9px; }
      .stat-value { font-size: 15px; }
      .section-heading { align-items: flex-start; flex-direction: column; gap: 4px; }
      .select-wrap { width: 100%; }
      .day-summary { grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; padding: 16px 14px; }
      .day-total { grid-column: 1; grid-row: 2; text-align: left; }
      .day-sessions { grid-column: 2; grid-row: 1 / span 2; }
      .day-details { padding: 0 14px 10px; }
      .session { align-items: flex-start; }
      .session-time { font-size: 12px; }
      .session-duration { font-size: 12px; }
      .contact-card { align-items: stretch; flex-direction: column; gap: 15px; padding: 18px; }
      .telegram-link { width: 100%; }
      .footer { align-items: flex-start; flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header cla
